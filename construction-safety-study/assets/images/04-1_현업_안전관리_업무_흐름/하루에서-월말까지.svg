<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="390" viewBox="0 0 1020 390" role="img">
<title>전날 작업 조정에서 월말까지</title><desc>전날 작업 조정, 당일 사전 확인, TBM, 작업 중 점검, 작업 후 인계, 주간과 월간 보고 순서</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#435c6d"/></marker><marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075f5a"/></marker><marker id="stop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b3c36"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1020" height="390" fill="#fff" stroke="#dbe5e9" rx="16"/><text x="29" y="41" fill="#183448" font-size="28" font-weight="750" text-anchor="start">전날 작업 조정에서 월말까지</text>
<rect x="34" y="73" width="292" height="105" fill="#e2f2ee" stroke="none" rx="10"/><text x="51" y="104" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">전날 · 작업 조정</text><text x="51" y="131" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">A구역 반출과 B구역 배근</text><text x="51" y="154" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">공용 진입로의 시간·구역 조율</text><rect x="364" y="73" width="292" height="105" fill="#eaf0f8" stroke="none" rx="10"/><text x="381" y="104" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">당일 · 작업 전 확인</text><text x="381" y="131" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">작업팀·장비·방호·당일 조건</text><text x="381" y="154" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">평가 및 해당 계획·허가 확인</text><rect x="694" y="73" width="292" height="105" fill="#e2f2ee" stroke="none" rx="10"/><text x="711" y="104" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">작업 전 · TBM</text><text x="711" y="131" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">최신 위험·대책·연락 경로</text><text x="711" y="154" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">작업조 의견 확인 후 작업</text><rect x="694" y="218" width="292" height="105" fill="#eaf0f8" stroke="none" rx="10"/><text x="711" y="249" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">작업 중 · 점검</text><text x="711" y="276" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">조건 변경·지적 발견</text><text x="711" y="299" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">필요한 통제를 먼저 적용</text><rect x="364" y="218" width="292" height="105" fill="#e2f2ee" stroke="none" rx="10"/><text x="381" y="249" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">작업 후 · 인계</text><text x="381" y="276" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">조치 이행과 재확인</text><text x="381" y="299" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">미결은 통제·담당·기한 인계</text><rect x="34" y="218" width="292" height="105" fill="#eaf0f8" stroke="none" rx="10"/><text x="51" y="249" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">주간·월간 · 보고</text><text x="51" y="276" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">금주 실적·차주 위험 작업</text><text x="51" y="299" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">비용·이행 근거와 함께 검토</text><path d="M327 124H361" stroke="#435c6d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M657 124H691" stroke="#435c6d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M840 181V212" stroke="#435c6d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M692 268H658" stroke="#435c6d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M362 268H328" stroke="#435c6d" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="34" y="363" fill="#075f5a" font-size="19" font-weight="750" text-anchor="start">작업 중 조건이 달라지면 영향받는 구역의 작업 전 확인 단계로 돌아갑니다.</text></g>
</svg>
