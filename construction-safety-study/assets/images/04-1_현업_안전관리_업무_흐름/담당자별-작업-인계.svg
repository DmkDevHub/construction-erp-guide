stroke="#435c6d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M583 348H591V450H595" stroke="#435c6d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M778 450H790" stroke="#435c6d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="31" y="536" fill="#075f5a" font-size="19" font-weight="750" text-anchor="start">현장소장 또는 지정 승인자는 해당 작업·문서의 승인 권한과 범위를 확인합니다.</text></g>
