<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="570" viewBox="0 0 1020 570" role="img">
<title>담당자가 넘기는 정보와 확인</title><desc>공사 담당, 협력업체 작업책임자, 안전팀, 관리감독자 사이 전날 조정부터 현장 확인과 인계까지의 역할</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#435c6d"/></marker><marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075f5a"/></marker><marker id="stop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b3c36"/></marker></defs>
