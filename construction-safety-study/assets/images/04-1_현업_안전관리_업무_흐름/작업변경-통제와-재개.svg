<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="543" viewBox="0 0 1020 543" role="img">
<title>변경을 발견했을 때 대상 작업의 판단 흐름</title><desc>변경을 통보하고 영향 구역을 통제하며 위험과 조건을 다시 확인한 뒤 적합한 경우에만 적용 절차에 따라 재개 판단</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#435c6d"/></marker><marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075f5a"/></marker><marker id="stop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b3c36"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1020" height="543" fill="#fff" stroke="#dbe5e9" rx="16"/><text x="29" y="41" fill="#183448" font-size="28" font-weight="750" text-anchor="start">변경을 발견했을 때 대상 작업의 판단 흐름</text>
<rect x="32" y="72" width="284" height="93" fill="#eaf0f8" stroke="none" rx="10"/><text x="49" y="103" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">변경 발견·알림</text><text x="49" y="130" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">차량 시간·경로가 달라짐</text><text x="49" y="153" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">공사 담당과 작업조에 전달</text><rect x="366" y="72" width="284" height="93" fill="#fbede8" stroke="none" rx="10"/><text x="383" y="103" fill="#9b3c36" font-size="21" font-weight="750" text-anchor="start">영향 구역 통제</text><text x="383" y="130" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">해당 작업·출입 범위 확인</text><text x="383" y="153" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">급박하면 즉시 중지·대피</text><rect x="700" y="72" width="284" height="93" fill="#eaf0f8" stroke="none" rx="10"/><text x="717" y="103" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">위험과 조건 검토</text><text x="717" y="130" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">평가·계획·허가 영향 확인</text><text x="717" y="153" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">변경 내용을 작업조에 공유</text><path d="M319 120H361" stroke="#435c6d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M653 120H695" stroke="#435c6d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M842 168V208H512V226" stroke="#435c6d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="281" y="232" width="459" height="60" fill="#f9f0df" stroke="#e6d8b7" rx="10"/><text x="510" y="270" fill="#8f581c" font-size="22" font-weight="750" text-anchor="middle">조치·방호·공유를 현장에서 확인했는가?</text><path d="M411 294V326H270V346" stroke="#9b3c36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stop)"/><path d="M609 294V326H750V346" stroke="#075f5a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#go)"/><text x="274" y="324" fill="#9b3c36" font-size="16" font-weight="750" text-anchor="start">미충족</text><text x="714" y="324" fill="#075f5a" font-size="16" font-weight="750" text-anchor="start">충족</text><rect x="29" y="353" width="456" height="100" fill="#fbede8" stroke="none" rx="10"/><text x="46" y="384" fill="#9b3c36" font-size="21" font-weight="750" text-anchor="start">통제 유지 · 보완 후 재확인</text><text x="46" y="411" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">담당자와 기한, 남은 조건을 기록</text><text x="46" y="434" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">재확인 전에는 영향 구역을 별도로 관리</text><rect x="534" y="353" width="456" height="100" fill="#e2f2ee" stroke="none" rx="10"/><text x="551" y="384" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">지정 권한에서 재개 판단</text><text x="551" y="411" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">확인자·시각·적용 문서를 남김</text><text x="551" y="434" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">새 조건을 관계 작업조에 다시 알림</text><text x="32" y="497" fill="#435c6d" font-size="17" font-weight="500" text-anchor="start">행정기관의 작업중지 명령이 있으면 해당 해제 절차를 별도로 확인합니다.</text></g>
</svg>
