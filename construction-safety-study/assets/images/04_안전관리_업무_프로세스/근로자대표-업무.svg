<svg xmlns="http://www.w3.org/2000/svg" width="900" height="171" viewBox="0 0 900 171" role="img" aria-labelledby="title description">
  <title id="title">근로자대표 · 현장 의견을 모아 조치 결과를 확인하는 과정</title>
  <desc id="description">근로자 의견 수렴 → 참여 요청 → 평가·회의에 제시 → 결과 확인·공유. 대표하는 근로자와 회의 결과·조치 진행 상황을 공유.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#486474"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="169" rx="14" fill="#fff" stroke="#dbe5e9"/>
  <g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
    <text x="24" y="38" font-size="24" font-weight="700" fill="#183448">근로자대표 · 현장 의견을 모아 조치 결과를 확인하는 과정</text>
    <g>
      <g>
        <rect x="24" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="36" y="86" font-size="17" font-weight="700" fill="#183448">근로자 의견 수렴</text>
        <text x="36" y="108" font-size="14" fill="#435c6d">위치·작업·제보 내용 정리</text>
      </g>
      <g>
        <rect x="242" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="254" y="86" font-size="17" font-weight="700" fill="#183448">참여 요청</text>
        <text x="254" y="108" font-size="14" fill="#435c6d">필요 시 사업주에게 요청</text>
      </g>
      <g>
        <rect x="460" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="472" y="86" font-size="17" font-weight="700" fill="#183448">평가·회의에 제시</text>
        <text x="472" y="108" font-size="14" fill="#435c6d">위험 사례와 개선안 전달</text>
      </g>
      <g>
        <rect x="678" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="690" y="86" font-size="17" font-weight="700" fill="#183448">결과 확인·공유</text>
        <text x="690" y="108" font-size="14" fill="#435c6d">담당·기한·회신을 확인</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 91h16"/>
        <path d="M440 91h16"/>
        <path d="M658 91h16"/>
      </g>
      <text x="24" y="151" font-size="15" fill="#435c6d">대표하는 근로자와 회의 결과·조치 진행 상황을 공유</text>
    </g>
  </g>
</svg>
