<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264" role="img">
<title>회의체별 안건과 후속 과제</title><desc>산업안전보건위원회 노사 참여·법정 안건 심의·의결 사항과 후속 조치. 건설업 노사협의체 제75조 적용 조건 확인 구성과 조항별 특례를 검토. 도급 안전보건협의체 도급인과 관계수급인 참여 공정·일정·연락·작업 조정</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="264" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">회의체별 안건과 후속 과제</text><rect x="28" y="66" width="304" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">산업안전보건위원회</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">노사 참여·법정 안건</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">심의·의결 사항과 후속 조치</text><rect x="348" y="66" width="304" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="366" y="96" font-size="21" fill="#0b6b63" font-weight="750">건설업 노사협의체</text><text x="366" y="122" font-size="16" fill="#435e70" font-weight="500">제75조 적용 조건 확인</text><text x="366" y="142" font-size="16" fill="#435e70" font-weight="500">구성과 조항별 특례를 검토</text><rect x="668" y="66" width="304" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="686" y="96" font-size="21" fill="#0b6b63" font-weight="750">도급 안전보건협의체</text><text x="686" y="122" font-size="16" fill="#435e70" font-weight="500">도급인과 관계수급인 참여</text><text x="686" y="142" font-size="16" fill="#435e70" font-weight="500">공정·일정·연락·작업 조정</text><rect x="28" y="209" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="237" font-size="17" fill="#435e70" font-weight="650">회의록에는 확인 주체·안건·결정·이행기한을 남긴다</text>
</g></svg>
