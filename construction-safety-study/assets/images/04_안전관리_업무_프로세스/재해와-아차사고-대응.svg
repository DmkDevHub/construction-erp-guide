<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>재해 또는 아차사고 후 처리 순서</title><desc>초기 대응 필요한 구조·대피 2차 재해 방지. 분류·보고 피해·작업 사실 내부·대외 판단. 조사·개선 원인과 대책 담당·기한·이행 확인. 재평가 비슷한 작업에 전파 재발 방지 확인</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">재해 또는 아차사고 후 처리 순서</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">초기 대응</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">필요한 구조·대피</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">2차 재해 방지</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">분류·보고</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">피해·작업 사실</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">내부·대외 판단</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">조사·개선</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">원인과 대책</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">담당·기한·이행 확인</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">재평가</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">비슷한 작업에 전파</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">재발 방지 확인</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">법정 통보·보고 시점과 회사 내부 보고 시점을 