<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="400" viewBox="0 0 1020 400" role="img">
<title>공용 진입로가 바뀌면 다시 확인할 지점</title><desc>차량 반출 경로와 배근조 이동이 겹치는 상황, 작업 경로와 시간 조건을 재조정한 개념도</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#435c6d"/></marker><marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075f5a"/></marker><marker id="stop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b3c36"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1020" height="400" fill="#fff" stroke="#dbe5e9" rx="16"/><text x="29" y="41" fill="#183448" font-size="28" font-weight="750" text-anchor="start">공용 진입로가 바뀌면 다시 확인할 지점</text>
<rect x="28" y="65" width="470" height="282" fill="#fbede8" stroke="none" rx="10"/><text x="47" y="98" fill="#9b3c36" font-size="21" font-weight="750" text-anchor="start">10:20 변경 제보 · 겹치는 지점</text><rect x="51" y="120" width="173" height="64" fill="#fff" stroke="#b6cbd3" rx="5"/><rect x="300" y="120" width="174" height="64" fill="#fff" stroke="#b6cbd3" rx="5"/><text x="65" y="147" fill="#183448" font-size="17" font-weight="700" text-anchor="start">A구역 굴착·반출</text><text x="316" y="147" fill="#183448" font-size="17" font-weight="700" text-anchor="start">B구역 배근조</text><rect x="51" y="203" width="423" height="41" fill="#fff" stroke="#b6cbd3" rx="4"/><text x="63" y="224" fill="#325d91" font-size="14" font-weight="700" text-anchor="start">장비 반출 경로</text><path d="M195 225H441" stroke="#325d91" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M380 185V193H265V263" stroke="#9b3c36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stop)"/><circle cx="265" cy="225" r="14" fill="#f5c4b8"/><text x="265" y="231" fill="#9b3c36" font-size="20" font-weight="750" text-anchor="middle">×</text><text x="51" y="297" fill="#9b3c36" font-size="16" font-weight="750" text-anchor="start">작업자 이동과 변경된 차량 반출이 겹칠 수 있음</text><text x="51" y="326" fill="#9b3c36" font-size="16" font-weight="750" text-anchor="start">영향 구간을 먼저 통제하고 실제 조건 확인</text><rect x="522" y="65" width="470" height="282" fill="#e2f2ee" stroke="none" rx="10"/><text x="541" y="98" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">변경 후 검토 · 분리 및 확인</text><rect x="545" y="120" width="173" height="64" fill="#fff" stroke="#b6cbd3" rx="5"/><rect x="794" y="120" width="174" height="64" fill="#fff" stroke="#b6cbd3" rx="5"/><text x="559" y="147" fill="#183448" font-size="17" font-weight="700" text-anchor="start">A구역 굴착·반출</text><text x="810" y="147" fill="#183448" font-size="17" font-weight="700" text-anchor="start">B구역 배근조</text><rect x="545" y="203" width="423" height="41" fill="#fff" stroke="#b6cbd3" rx="4"/><text x="557" y="224" fill="#325d91" font-size="14" font-weight="700" text-anchor="start">장비 반출 경로</text><path d="M689 225H935" stroke="#325d91" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="545" y="259" width="423" height="41" fill="#fff" stroke="#b6cbd3" rx="4"/><text x="557" y="284" fill="#075f5a" font-size="14" font-weight="700" text-anchor="start">지정 보행 경로</text><path d="M936 282H699" stroke="#075f5a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#go)"/><path d="M780 245V258" stroke="#075f5a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="545" y="326" fill="#075f5a" font-size="16" font-weight="750" text-anchor="start">분리 가능한 위치·차량 시간·교차 통제 재확인</text><text x="28" y="376" fill="#435c6d" font-size="17" font-weight="500" text-anchor="start">가상 배치입니다. 통제 방법, 유도 위치와 실제 동선은 해당 현장의 작업계획으로 정합니다.</text></g>
</svg>
