<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>안전보건교육의 대상과 이수 증빙</title><desc>정기교육 대상 근로자·관리감독자 대상과 주기 확인. 채용·변경 시 교육 업무 배치 전 적용 조건 확인 신규와 작업 변경을 구별. 특별교육 법령의 해당 유해·위험작업 대상 작업의 시간·내용 대조. 건설업 기초안전보건교육 대상 건설 일용근로자와 이수 확인 기초교육과 작업별 교육을 함께 검토</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="387" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">안전보건교육의 대상과 이수 증빙</text><rect x="28" y="66" width="464" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">정기교육</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">대상 근로자·관리감독자</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">대상과 주기 확인</text><rect x="508" y="66" width="464" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="526" y="96" font-size="21" fill="#0b6b63" font-weight="750">채용·변경 시 교육</text><text x="526" y="122" font-size="16" fill="#435e70" font-weight="500">업무 배치 전 적용 조건 확인</text><text x="526" y="142" font-size="16" fill="#435e70" font-weight="500">신규와 작업 변경을 구별</text><rect x="28" y="189" width="464" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="46" y="219" font-size="21" fill="#0b6b63" font-weight="750">특별교육</text><text x="46" y="245" font-size="16" fill="#435e70" font-weight="500">법령의 해당 유해·위험작업</text><text x="46" y="265" font-size="16" fill="#435e70" font-weight="500">대상 작업의 시간·내용 대조</text><rect x="508" y="189" width="464" height="110" rx="11" fill="#edf2f5" stroke="none"/><text x="526" y="219" font-size="21" fill="#0b6b63" font-weight="750">건설업 기초안전보건교육</text><text x="526" y="245" font-size="16" fill="#435e70" font-weight="500">대상 건설 일용근로자와 이수 확인</text><text x="526" y="265" font-size="16" fill="#435e70" font-weight="500">기초교육과 작업별 교육을 함께 검토</text><rect x="28" y="332" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="360" font-size="17" fill="#435e70" font-weight="650">교육계획·실시 내용·참여·이수와 작업 투입 판단을 연결</text>
</g></svg>
