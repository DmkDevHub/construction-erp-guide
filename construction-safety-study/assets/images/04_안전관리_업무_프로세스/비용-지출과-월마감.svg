<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>산업안전보건관리비의 계상·집행·정산</title><desc>계상 인계 현장·공사 종류 계상 근거·변경. 사용 검토 품목·목적·한도 사용 기준 대조. 지출·첨부 금액·납품·증빙 사용명세와 확인. 월 마감 당사·업체별 대조 제외·수정·정산</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">산업안전보건관리비의 계상·집행·정산</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">계상 인계</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">현장·공사 종류</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">계상 근거·변경</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">사용 검토</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">품목·목적·한도</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">사용 기준 대조</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">지출·첨부</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">금액·납품·증빙</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">사용명세와 확인</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">월 마감</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">당사·업체별 대조</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">제외·수정·정산</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">사진이나 결재 내역과 함께 실제 사용 목적과 거래