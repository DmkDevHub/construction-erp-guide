<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>작업허가의 신청·검토·재허가·종결</title><desc>신청 업체·장소·시간·작업 평가와 방호 조건. 검토·승인 지정 담당 검토 허가 범위와 유효기간. 작업·변경 조건 준수 확인 변경·중지 시 재검토. 완료 종료와 현장 상태 허가·점검·인계 기록</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">작업허가의 신청·검토·재허가·종결</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">신청</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">업체·장소·시간·작업</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">평가와 방호 조건</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">검토·승인</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">지정 담당 검토</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">허가 범위와 유효기간</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">작업·변경</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">조건 준수 확인</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">변경·중지 시 재검토</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">완료</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">종료와 현장 상태</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">허가·점검·인계 기록</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">조건이 바뀌면 승인 상태와 현장 작업