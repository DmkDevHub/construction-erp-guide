<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>신규 작업조 투입 확인</title><desc>업체가 제출 소속·작업·일자 필요 자격과 교육. 현장 확인 작업 위험과 적합성 보호구·누락 보완. 작업 배정 작업조·위치 확정 변경·종료를 기록</desc>
