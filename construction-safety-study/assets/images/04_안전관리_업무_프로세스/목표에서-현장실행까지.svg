<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>본사 방침을 현장 목표와 실적으로 연결</title><desc>방침·자원 본사 방침과 예산 현장 위험·공정 반영. 현장 목표 현장소장·담당 지정 지표·기한·측정 방법. 점검과 개선 예정 대비 이행 확인 미흡 사유와 후속 담당</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">본사 방침을 현장 목표와 실적으로 연결</text><rect x="28" y="69" width="298.6666666666667" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">방침·자원</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">본사 방침과 예산</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">현장 위험·공정 반영</text><path d="M 328.6666666666667 137 L 348.6666666666667 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="350.6666666666667" y="69" width="298.6666666666667" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="365.6666666666667" y="103" font-size="22" fill="#0b6b63" font-weight="750">현장 목표</text><text x="365.6666666666667" y="134" font-size="16" fill="#435e70" font-weight="500">현장소장·담당 지정</text><text x="365.6666666666667" y="158" font-size="16" fill="#435e70" font-weight="500">지표·기한·측정 방법</text><path d="M 651.3333333333334 137 L 671.3333333333334 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="673.3333333333334" y="69" width="298.6666666666667" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="688.3333333333334" y="103" font-size="22" fill="#0b6b63" font-weight="750">점검과 개선</text><text x="688.3333333333334" y="134" font-size="16" fill="#435e70" font-weight="500">예정 대비 이행 확인</text><text x="688.3333333333334" y="158" font-size="16" fill="#435e70" font-weight="500">미흡 사유와 후속 담당</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">목표는 측정할 기준과 제출할 증빙을 함께 정한다</text>
</g></svg>
