<svg xmlns="http://www.w3.org/2000/svg" width="900" height="171" viewBox="0 0 900 171" role="img" aria-labelledby="title description">
  <title id="title">발주자 측 안전보건조정자 · 공사 간 혼재 작업 조정</title>
  <desc id="description">공사별 계획 받기 → 혼재 위험 파악 → 작업 시기·내용 조정 → 정보 공유 여부 확인. 선임 적용 현장 기준 · 혼재 작업, 조정 결과, 각 공사 전달과 확인 내역을 기록.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#486474"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="169" rx="14" fill="#fff" stroke="#dbe5e9"/>
  <g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
    <text x="24" y="38" font-size="24" font-weight="700" fill="#183448">발주자 측 안전보건조정자 · 공사 간 혼재 작업 조정</text>
    <g>
      <g>
        <rect x="24" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="36" y="86" font-size="17" font-weight="700" fill="#183448">공사별 계획 받기</text>
        <text x="36" y="108" font-size="14" fill="#435c6d">도급인별 공정표와 구역</text>
      </g>
      <g>
        <rect x="242" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="254" y="86" font-size="17" font-weight="700" fill="#183448">혼재 위험 파악</text>
        <text x="254" y="108" font-size="14" fill="#435c6d">공용 공간과 겹치는 작업</text>
      </g>
      <g>
        <rect x="460" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="472" y="86" font-size="17" font-weight="700" fill="#183448">작업 시기·내용 조정</text>
        <text x="472" y="108" font-size="14" fill="#435c6d">각 공사에 적용 조건 전달</text>
      </g>
      <g>
        <rect x="678" y="58" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="690" y="86" font-size="17" font-weight="700" fill="#183448">정보 공유 여부 확인</text>
        <text x="690" y="108" font-size="14" fill="#435c6d">각 도급인 책임자 간 확인</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 91h16"/>
        <path d="M440 91h16"/>
        <path d="M658 91h16"/>
      </g>
      <text x="24" y="151" font-size="15" fill="#435c6d">선임 적용 현장 기준 · 혼재 작업, 조정 결과, 각 공사 전달과 확인 내역을 기록</text>
    </g>
  </g>
</svg>
