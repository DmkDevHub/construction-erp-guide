<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>본사 점검과 현장 이행 근거</title><desc>본사 의무 목록 현장별 적용 조문 책임과 점검 주기. 현장 근거 교육·평가·비상 대응 수행일·확인자 기록. 미흡 보완 기한·자원·책임 정함 이행 재확인과 보고</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">본사 점검과 현장 이행 근거</text><rect x="28" y="69" width="298.6666666666667" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">본사 의무 목록</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">현장별 적용 조문</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">책임과 점검 주기</text><path d="M 328.6666666666667 137 L 348.6666666666667 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="350.6666666666667" y="69" width="298.6666666666667" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="365.6666666666667" y="103" font-size="22" fill="#0b6b63" font-weight="750">현장 근거</text><text x="365.6666666666667" y="134" font-size="16" fill="#435e70" font-weight="500">교육·평가·비상 대응</text><text x="365.6666666666667" y="158" font-size="16" fill="#435e70" font-weight="500">수행일·확인자 기록</text><path d="M 651.3333333333334 137 L 671.3333333333334 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="673.3333333333334" y="69" width="298.6666666666667" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="688.3333333333334" y="103" font-size="22" fill="#0b6b63" font-weight="750">미흡 보완</text><text x="688.3333333333334" y="134" font-size="16" fill="#435e70" font-weight="500">기한·자원·책임 정함</text><text x="688.3333333333334" y="158" font-size="16" fill="#435e70" font-weight="500">이행 재확인과 보고</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">관리자의 확인과 현장 조치 증빙을 서로 연결</text>
</g></svg>
