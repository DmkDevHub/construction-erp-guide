<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264" role="img">
<title>일간·주간·월간 업무와 이월 기록</title><desc>일간 작업·교육·허가·TBM·점검 발견 사항과 조치 등록. 주간 동시 일정·위험 검토 협의와 기한·미해결 항목 인계. 월간 비용·계획 실적 대조와 보고 월말 기준과 미종결 표시</desc>
