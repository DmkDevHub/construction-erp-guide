<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>현장과 협력업체의 투입·변경·종료</title><desc>현장 개설 공사 기간·구역 조직과 업체 등록. 업체 투입 계약·공종·역할 기준과 공용동선 전달. 변경·평가 공정·업체 범위 갱신 인계, 평가 및 종료</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">현장과 협력업체의 투입·변경·종료</text><rect x="28" y="69" width="298.6666666666667" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">현장 개설</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">공사 기간·구역</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">조직과 업체 등록</text><path d="M 328.6666666666667 137 L 348.6666666666667 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="350.6666666666667" y="69" width="298.6666666666667" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="365.6666666666667" y="103" font-size="22" fill="#0b6b63" font-weight="750">업체 투입</text><text x="365.6666666666667" y="134" font-size="16" fill="#435e70" font-weight="500">계약·공종·역할</text><text x="365.6666666666667" y="158" font-size="16" fill="#435e70" font-weight="500">기준과 공용동선 전달</text><path d="M 651.3333333333334 137 L 671.3333333333334 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="673.3333333333334" y="69" width="298.6666666666667" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="688.3333333333334" y="103" font-size="22" fill="#0b6b63" font-weight="750">변경·평가</text><text x="688.3333333333334" y="134" font-size="16" fill="#435e70" font-weight="500">공정·업체 범위 갱신</text><text x="688.3333333333334" y="158" font-size="16" fill="#435e70" font-weight="500">인계, 평가 및 종료</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">회사와 현장, 계약·작업 범위가 바뀌면 관련 권한·절차도 갱신</text>
</g></svg>
