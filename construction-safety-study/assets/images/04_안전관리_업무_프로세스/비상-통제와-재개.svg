<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>위험 발견에서 재개 판단까지</title><desc>발견·알림 위치·상황 보고 급박 위험을 통제. 중지·대피 작업자 이탈·접근 제한 필요한 대응과 신고. 보완·재개 판단 위험 제거와 확인 권한 있는 역할 확인</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">위험 발견에서 재개 판단까지</text><rect x="28" y="69" width="298.6666666666667" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">발견·알림</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">위치·상황 보고</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">급박 위험을 통제</text><path d="M 328.6666666666667 137 L 348.6666666666667 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="350.6666666666667" y="69" width="298.6666666666667" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="365.6666666666667" y="103" font-size="22" fill="#0b6b63" font-weight="750">중지·대피</text><text x="365.6666666666667" y="134" font-size="16" fill="#435e70" font-weight="500">작업자 이탈·접근 제한</text><text x="365.6666666666667" y="158" font-size="16" fill="#435e70" font-weight="500">필요한 대응과 신고</text><path d="M 651.3333333333334 137 L 671.3333333333334 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="673.3333333333334" y="69" width="298.6666666666667" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="688.3333333333334" y="103" font-size="22" fill="#0b6b63" font-weight="750">보완·재개 판단</text><text x="688.3333333333334" y="134" font-size="16" fill="#435e70" font-weight="500">위험 제거와 확인</text><text x="688.3333333333334" y="158" font-size="16" fill="#435e70" font-weight="500">권한 있는 역할 확인</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">행정기관의 작업중지 명령이 있으면 법정 해제 절차를 별도 확인</text>
</g></svg>
