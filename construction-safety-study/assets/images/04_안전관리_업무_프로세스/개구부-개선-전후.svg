<path d="M652 183v14m178-14v14" stroke="#17374b" stroke-width="4"/>
<text x="672" y="169" fill="#0b6b63" font-size="17" font-weight="750">개구부 덮개 표시</text>
<text x="50" y="253" font-size="16">위험 구역 접근 통제 · 담당 지정</text>
<text x="529" y="253" font-size="16">지정 확인자가 상태 확인과 결과를 기록</text>
