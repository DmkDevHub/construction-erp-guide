<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>개구부 지적에서 시정·재확인까지</title><desc>지적 전 상태 덮개 고정 상태가 불명확 영향 구역 접근 통제. 조치 배정 설치 기준·담당·기한 정비 완료와 근거 제출. 조치 후 확인 고정·표시·접근 조건 확인 확인자가 합격 여부 기록. 후속 처리 미충족이면 통제를 유지 보완·재점검을 다시 연결</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="387" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">개구부 지적에서 시정·재확인까지</text><rect x="28" y="66" width="464" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">지적 전 상태</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">덮개 고정 상태가 불명확</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">영향 구역 접근 통제</text><rect x="508" y="66" width="464" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="526" y="96" font-size="21" fill="#0b6b63" font-weight="750">조치 배정</text><text x="526" y="122" font-size="16" fill="#435e70" font-weight="500">설치 기준·담당·기한</text><text x="526" y="142" font-size="16" fill="#435e70" font-weight="500">정비 완료와 근거 제출</text><rect x="28" y="189" width="464" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="46" y="219" font-size="21" fill="#0b6b63" font-weight="750">조치 후 확인</text><text x="46" y="245" font-size="16" fill="#435e70" font-weight="500">고정·표시·접근 조건 확인</text><text x="46" y="265" font-size="16" fill="#435e70" font-weight="500">확인자가 합격 여부 기록</text><rect x="508" y="189" width="464" height="110" rx="11" fill="#edf2f5" stroke="none"/><text x="526" y="219" font-size="21" fill="#0b6b63" font-weight="750">후속 처리</text><text x="526" y="245" font-size="16" fill="#435e70" font-weight="500">미충족이면 통제를 유지</text><text x="526" y="265" font-size="16" fill="#435e70" font-weight="500">보완·재점검을 다시 연결</text><rect x="28" y="332" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="360" font-size="17" fill="#435e70" font-weight="650">작업 완료 보고와 재확인 결과가 각각 남아야 종결을 판단할 수 있다</text>
</g></svg>
