<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="337" viewBox="0 0 1020 337" role="img">
<title>하루 기록이 주간보고와 월말에 이어지는 방식</title><desc>당일 작업과 점검에서 주간 보고로 인계한 뒤 월별 증빙과 대조하는 업무</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#435c6d"/></marker><marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075f5a"/></marker><marker id="stop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b3c36"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1020" height="337" fill="#fff" stroke="#dbe5e9" rx="16"/><text x="29" y="41" fill="#183448" font-size="28" font-weight="750" text-anchor="start">하루 기록이 주간보고와 월말에 이어지는 방식</text>
<rect x="30" y="77" width="285" height="135" fill="#eaf0f8" stroke="none" rx="10"/><text x="47" y="108" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">당일 원기록</text><text x="47" y="135" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">작업 조정·평가·TBM</text><text x="47" y="158" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">점검 지적 및 조치 결과</text><text x="47" y="181" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">통제·담당·기한</text><rect x="367" y="77" width="285" height="135" fill="#e2f2ee" stroke="none" rx="10"/><text x="384" y="108" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">현장 주간보고</text><text x="384" y="135" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">공종·예정일·투입인원</text><text x="384" y="158" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">금주/차주 작업과 관리계획</text><text x="384" y="181" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">미결과 요청 지원</text><rect x="704" y="77" width="285" height="135" fill="#f9f0df" stroke="none" rx="10"/><text x="721" y="108" fill="#075f5a" font-size="21" font-weight="750" text-anchor="start">월별·본사 확인</text><text x="721" y="135" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">계상·집행 원증빙 대조</text><text x="721" y="158" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">분기 점검 등 이행 확인</text><text x="721" y="181" fill="#435c6d" font-size="16" font-weight="500" text-anchor="start">미결 건의 다음 이행일</text><path d="M318 145H362" stroke="#435c6d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M655 145H699" stroke="#435c6d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><path d="M850 222V242H171V216" stroke="#435c6d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="7 6"/><text x="513" y="278" fill="#075f5a" font-size="18" font-weight="750" text-anchor="middle">보고 수치에서 날짜·구역·담당·원기록을 다시 찾을 수 있게 연결</text></g>
</svg>
