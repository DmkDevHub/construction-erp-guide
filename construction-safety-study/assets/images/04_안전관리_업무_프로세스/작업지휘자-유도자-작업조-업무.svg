<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title description">
  <title id="title">작업지휘자·유도자와 작업조의 업무 순서</title>
  <desc id="description">작업지휘자 · 지정 대상 작업. 지정·계획서 확인 → 순서·역할 확인 → 계획에 따라 지휘 → 계획과 다르면 알림. 남기는 기록 · 작업계획서, 지정 및 계획 변경 통보. 유도자 · 배치되는 작업. 차량·구간 확인 → 유도 방법 확인 → 지정 구간에서 유도 → 위험·변경 통보. 남기는 기록 · 배치 구간과 시간, 교대·변경 연락. 근로자·운전원. TBM에서 확인 → 정해진 작업 수행 → 이상·변경 보고 → 새 조건 확인. 급박한 위험으로 작업을 중지·대피했다면 지체 없이 관리감독자 등에게 보고.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#486474"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="508" rx="14" fill="#fff" stroke="#dbe5e9"/>
  <g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
    <text x="24" y="38" font-size="24" font-weight="700" fill="#183448">작업지휘자·유도자와 작업조의 업무 순서</text>
    <g>
      <text x="24" y="79" font-size="19" fill="#075f5a" font-weight="700">작업지휘자 · 지정 대상 작업</text>
      <g>
        <rect x="24" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="36" y="121" font-size="17" font-weight="700" fill="#183448">지정·계획서 확인</text>
        <text x="36" y="143" font-size="14" fill="#435c6d">맡은 작업 범위 확인</text>
      </g>
      <g>
        <rect x="242" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="254" y="121" font-size="17" font-weight="700" fill="#183448">순서·역할 확인</text>
        <text x="254" y="143" font-size="14" fill="#435c6d">작업구역과 담당자 확인</text>
      </g>
      <g>
        <rect x="460" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="472" y="121" font-size="17" font-weight="700" fill="#183448">계획에 따라 지휘</text>
        <text x="472" y="143" font-size="14" fill="#435c6d">담당 작업 진행</text>
      </g>
      <g>
        <rect x="678" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="690" y="121" font-size="17" font-weight="700" fill="#183448">계획과 다르면 알림</text>
        <text x="690" y="143" font-size="14" fill="#435c6d">관리감독자에게 재확인 요청</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 126h16"/>
        <path d="M440 126h16"/>
        <path d="M658 126h16"/>
      </g>
      <text x="24" y="186" font-size="15" fill="#435c6d">남기는 기록 · 작업계획서, 지정 및 계획 변경 통보</text>
    </g>
    <g>
      <path d="M24 195H878" stroke="#dbe5e9"/>
      <text x="24" y="224" font-size="19" fill="#075f5a" font-weight="700">유도자 · 배치되는 작업</text>
      <g>
        <rect x="24" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="36" y="266" font-size="17" font-weight="700" fill="#183448">차량·구간 확인</text>
        <text x="36" y="288" font-size="14" fill="#435c6d">운전원과 담당 구간 확인</text>
      </g>
      <g>
        <rect x="242" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="254" y="266" font-size="17" font-weight="700" fill="#183448">유도 방법 확인</text>
        <text x="254" y="288" font-size="14" fill="#435c6d">운전원과 신호 확인</text>
      </g>
      <g>
        <rect x="460" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="472" y="266" font-size="17" font-weight="700" fill="#183448">지정 구간에서 유도</text>
        <text x="472" y="288" font-size="14" fill="#435c6d">정한 조건에 따라 안내</text>
      </g>
      <g>
        <rect x="678" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="690" y="266" font-size="17" font-weight="700" fill="#183448">위험·변경 통보</text>
        <text x="690" y="288" font-size="14" fill="#435c6d">정지 안내 후 담당자 보고</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 271h16"/>
        <path d="M440 271h16"/>
        <path d="M658 271h16"/>
      </g>
      <text x="24" y="331" font-size="15" fill="#435c6d">남기는 기록 · 배치 구간과 시간, 교대·변경 연락</text>
    </g>
    <g>
      <path d="M24 340H878" stroke="#dbe5e9"/>
      <text x="24" y="369" font-size="19" fill="#075f5a" font-weight="700">근로자·운전원</text>
      <g>
        <rect x="24" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="36" y="411" font-size="17" font-weight="700" fill="#183448">TBM에서 확인</text>
        <text x="36" y="433" font-size="14" fill="#435c6d">내 작업·통행·대기 위치</text>
      </g>
      <g>
        <rect x="242" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="254" y="411" font-size="17" font-weight="700" fill="#183448">정해진 작업 수행</text>
        <text x="254" y="433" font-size="14" fill="#435c6d">현장의 통제 조건 확인</text>
      </g>
      <g>
        <rect x="460" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="472" y="411" font-size="17" font-weight="700" fill="#183448">이상·변경 보고</text>
        <text x="472" y="433" font-size="14" fill="#435c6d">위치·시각·위험 전달</text>
      </g>
      <g>
        <rect x="678" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="690" y="411" font-size="17" font-weight="700" fill="#183448">새 조건 확인</text>
        <text x="690" y="433" font-size="14" fill="#435c6d">재개 전달 뒤 내 작업 확인</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 416h16"/>
        <path d="M440 416h16"/>
        <path d="M658 416h16"/>
      </g>
      <text x="24" y="476" font-size="15" fill="#435c6d">급박한 위험으로 작업을 중지·대피했다면 지체 없이 관리감독자 등에게 보고</text>
    </g>
  </g>
</svg>
