<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>굴착 동선 변경을 평가에 반영</title><desc>변경 파악 진입로 공용 사용 작업조·근로자 의견. 평가·대책 충돌 노출 결정 동선·시간 분리. 이행·주지 조치 상태 확인 TBM에서 새 조건 공유. 재확인 교차점 확인과 기록 미흡 시 통제·재평가</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">굴착 동선 변경을 평가에 반영</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">변경 파악</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">진입로 공용 사용</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">작업조·근로자 의견</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">평가·대책</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">충돌 노출 결정</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">동선·시간 분리</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">이행·주지</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">조치 상태 확인</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">TBM에서 새 조건 공유</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">재확인</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">교차점 확인과 기록</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">미흡 시 통제·재평가</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">적용할 현행 고시와 확인된 결과를 함께 남긴다</text>
</g></svg>
