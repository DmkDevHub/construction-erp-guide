<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>유해인자부터 사후관리까지</title><desc>작업 파악 절단 분진·소음 노출 작업과 인원. 적용 확인 측정·건강진단 대상 업무 영역별 일정. 사후관리 결과 기반 작업 개선 보건 자료 열람 제한</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">유해인자부터 사후관리까지</text><rect x="28" y="69" width="298.6666666666667" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">작업 파악</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">절단 분진·소음</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">노출 작업과 인원</text><path d="M 328.6666666666667 137 L 348.6666666666667 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="350.6666666666667" y="69" width="298.6666666666667" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="365.6666666666667" y="103" font-size="22" fill="#0b6b63" font-weight="750">적용 확인</text><text x="365.6666666666667" y="134" font-size="16" fill="#435e70" font-weight="500">측정·건강진단 대상</text><text x="365.6666666666667" y="158" font-size="16" fill="#435e70" font-weight="500">업무 영역별 일정</text><path d="M 651.3333333333334 137 L 671.3333333333334 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="673.3333333333334" y="69" width="298.6666666666667" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="688.3333333333334" y="103" font-size="22" fill="#0b6b63" font-weight="750">사후관리</text><text x="688.3333333333334" y="134" font-size="16" fill="#435e70" font-weight="500">결과 기반 작업 개선</text><text x="688.3333333333334" y="158" font-size="16" fill="#435e70" font-weight="500">보건 자료 열람 제한</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">관리용 이행 상태와 제한된 개인건강 정보는 접근 범위를 다르게 둔다</text>
</g></svg>
