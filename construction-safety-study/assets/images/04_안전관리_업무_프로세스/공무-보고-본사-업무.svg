<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title description">
  <title id="title">공무·보고 담당과 본사 안전보건 담당의 업무 순서</title>
  <desc id="description">공무·자재 담당. 조치 요청 받기 → 공급 진행 → 증빙 대조 → 월별 자료에 반영. 남기는 기록 · 요청·승인·거래와 설치 또는 사용 증빙. 현장 보고 담당. 일일 기록 취합 → 조치 상태 확인 → 차주 작업 확인 → 주간보고·지원 요청. 남기는 기록 · 주간보고, 원기록 번호, 미결·지원 요청. 본사 안전보건 담당. 현장·기간·근거 확인 → 반복 위험 검토 → 지원·확인 일정 회신 → 공통 개선 반영. 남기는 기록 · 검토 의견, 지원 회신, 후속 확인 또는 개정 이력.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#486474"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="508" rx="14" fill="#fff" stroke="#dbe5e9"/>
  <g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
    <text x="24" y="38" font-size="24" font-weight="700" fill="#183448">공무·보고 담당과 본사 안전보건 담당의 업무 순서</text>
    <g>
      <text x="24" y="79" font-size="19" fill="#075f5a" font-weight="700">공무·자재 담당</text>
      <g>
        <rect x="24" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="36" y="121" font-size="17" font-weight="700" fill="#183448">조치 요청 받기</text>
        <text x="36" y="143" font-size="14" fill="#435c6d">필요 자재·장비·외주 파악</text>
      </g>
      <g>
        <rect x="242" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="254" y="121" font-size="17" font-weight="700" fill="#183448">공급 진행</text>
        <text x="254" y="143" font-size="14" fill="#435c6d">사용 기준과 승인 확인</text>
      </g>
      <g>
        <rect x="460" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="472" y="121" font-size="17" font-weight="700" fill="#183448">증빙 대조</text>
        <text x="472" y="143" font-size="14" fill="#435c6d">거래와 설치·사용 확인</text>
      </g>
      <g>
        <rect x="678" y="93" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="690" y="121" font-size="17" font-weight="700" fill="#183448">월별 자료에 반영</text>
        <text x="690" y="143" font-size="14" fill="#435c6d">해당 안전보건관리비 연결</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 126h16"/>
        <path d="M440 126h16"/>
        <path d="M658 126h16"/>
      </g>
      <text x="24" y="186" font-size="15" fill="#435c6d">남기는 기록 · 요청·승인·거래와 설치 또는 사용 증빙</text>
    </g>
    <g>
      <path d="M24 195H878" stroke="#dbe5e9"/>
      <text x="24" y="224" font-size="19" fill="#075f5a" font-weight="700">현장 보고 담당</text>
      <g>
        <rect x="24" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="36" y="266" font-size="17" font-weight="700" fill="#183448">일일 기록 취합</text>
        <text x="36" y="288" font-size="14" fill="#435c6d">점검·조치·업체 조정</text>
      </g>
      <g>
        <rect x="242" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="254" y="266" font-size="17" font-weight="700" fill="#183448">조치 상태 확인</text>
        <text x="254" y="288" font-size="14" fill="#435c6d">관리감독자와 완료 확인</text>
      </g>
      <g>
        <rect x="460" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="472" y="266" font-size="17" font-weight="700" fill="#183448">차주 작업 확인</text>
        <text x="472" y="288" font-size="14" fill="#435c6d">공사 담당과 일정·인원 확인</text>
      </g>
      <g>
        <rect x="678" y="238" width="196" height="67" rx="9" fill="#eaf0f8"/>
        <text x="690" y="266" font-size="17" font-weight="700" fill="#183448">주간보고·지원 요청</text>
        <text x="690" y="288" font-size="14" fill="#435c6d">원기록 번호와 미결 연결</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 271h16"/>
        <path d="M440 271h16"/>
        <path d="M658 271h16"/>
      </g>
      <text x="24" y="331" font-size="15" fill="#435c6d">남기는 기록 · 주간보고, 원기록 번호, 미결·지원 요청</text>
    </g>
    <g>
      <path d="M24 340H878" stroke="#dbe5e9"/>
      <text x="24" y="369" font-size="19" fill="#075f5a" font-weight="700">본사 안전보건 담당</text>
      <g>
        <rect x="24" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="36" y="411" font-size="17" font-weight="700" fill="#183448">현장·기간·근거 확인</text>
        <text x="36" y="433" font-size="14" fill="#435c6d">보고 수치와 원기록 대조</text>
      </g>
      <g>
        <rect x="242" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="254" y="411" font-size="17" font-weight="700" fill="#183448">반복 위험 검토</text>
        <text x="254" y="433" font-size="14" fill="#435c6d">현장 지원 필요 건 검토</text>
      </g>
      <g>
        <rect x="460" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="472" y="411" font-size="17" font-weight="700" fill="#183448">지원·확인 일정 회신</text>
        <text x="472" y="433" font-size="14" fill="#435c6d">후속 확인을 현장에 전달</text>
      </g>
      <g>
        <rect x="678" y="383" width="196" height="67" rx="9" fill="#e2f2ee"/>
        <text x="690" y="411" font-size="17" font-weight="700" fill="#183448">공통 개선 반영</text>
        <text x="690" y="433" font-size="14" fill="#435c6d">점검 항목과 기준 검토</text>
      </g>
      <g fill="none" stroke="#486474" stroke-width="2" marker-end="url(#arrow)">
        <path d="M222 416h16"/>
        <path d="M440 416h16"/>
        <path d="M658 416h16"/>
      </g>
      <text x="24" y="476" font-size="15" fill="#435c6d">남기는 기록 · 검토 의견, 지원 회신, 후속 확인 또는 개정 이력</text>
    </g>
  </g>
</svg>
