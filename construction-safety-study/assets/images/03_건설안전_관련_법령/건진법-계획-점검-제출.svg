<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">건설공사 안전관리계획부터 준공 기록까지</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">착공 전 작성</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">시공자 계획 수립</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">대상 요건 검토</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">검토·승인</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">발주·인허가 경로 확인</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">대상별 검토기관</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">시공 중 확인</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">자체·정기·정밀 점검</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">지적과 보완 기록</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">정리·제출</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">안전점검 종합보고서</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">해당 제출 경로 확인</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">대상에 따라 