<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>건설공사 안전관리계획부터 준공 기록까지</title><desc>착공 전 작성 시공자 계획 수립 대상 요건 검토. 검토·승인 발주·인허가 경로 확인 대상별 검토기관. 시공 중 확인 자체·정기·정밀 점검 지적과 보완 기록. 정리·제출 안전점검 종합보고서 해당 제출 경로 확인</desc>
