<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>노출 위치가 달라지면 살필 조문도 달라진다</title><desc>굴착면과 흙막이 굴착면 붕괴·매설물 조건 계획 및 지반 변화 확인. 골조층 개구부 추락 위험 위치와 방호 조건 제42·43조와 설치·재확인. 양중 경로 매단 하중과 인양 구역 장비·작업계획과 접근 통제. 노출·보호구 분진·소음 또는 밀폐공간 해당 장비와 작업의 조치 기준</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="387" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">노출 위치가 달라지면 살필 조문도 달라진다</text><rect x="28" y="66" width="464" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">굴착면과 흙막이</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">굴착면 붕괴·매설물 조건</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">계획 및 지반 변화 확인</text><rect x="508" y="66" width="464" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="526" y="96" font-size="21" fill="#0b6b63" font-weight="750">골조층 개구부</text><text x="526" y="122" font-size="16" fill="#435e70" font-weight="500">추락 위험 위치와 방호 조건</text><text x="526" y="142" font-size="16" fill="#435e70" font-weight="500">제42·43조와 설치·재확인</text><rect x="28" y="189" width="464" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="46" y="219" font-size="21" fill="#0b6b63" font-weight="750">양중 경로</text><text x="46" y="245" font-size="16" fill="#435e70" font-weight="500">매단 하중과 인양 구역</text><text x="46" y="265" font-size="16" fill="#435e70" font-weight="500">장비·작업계획과 접근 통제</text><rect x="508" y="189" width="464" height="110" rx="11" fill="#edf2f5" stroke="none"/><text x="526" y="219" font-size="21" fill="#0b6b63" font-weight="750">노출·보호구</text><text x="526" y="245" font-size="16" fill="#435e70" font-weight="500">분진·소음 또는 밀폐공간</text><text x="526" y="265" font-size="16" fill="#435e70" font-weight="500">해당 장비와 작업의 조치 기준</text><rect x="28" y="332" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="360" font-size="17" fill="#435e70" font-weight="650">작업별 대책을 적용하고 개선 뒤 현장 상태를 다시 확인</text>
</g></svg>
