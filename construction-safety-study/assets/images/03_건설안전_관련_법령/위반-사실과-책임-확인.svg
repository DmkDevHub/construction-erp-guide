<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>안전보건 의무 위반의 판단 순서</title><desc>사실 확보 위치·일자·작업 조치와 피해 확인. 의무 주체 확인 적용 조항과 기준 사업주·도급 관계. 근거 확인 행정조치·과태료 형사책임 조항. 후속 기록 시정 요구와 이행 수신 및 재확인</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">안전보건 의무 위반의 판단 순서</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">사실 확보</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">위치·일자·작업</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">조치와 피해 확인</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">의무 주체 확인</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">적용 조항과 기준</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">사업주·도급 관계</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">근거 확인</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">행정조치·과태료</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">형사책임 조항</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">후속 기록</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">시정 요구와 이행</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">수신 및 재확인</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">사고 사실, 의무 불이행, 제재·책임의 판단 근거를 따로 남김</text>
</g></svg>
