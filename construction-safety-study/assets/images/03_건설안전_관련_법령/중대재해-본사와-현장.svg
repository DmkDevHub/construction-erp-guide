<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>본사 관리 조치와 현장 이행 증빙</title><desc>경영책임자등 방침·예산·인력 법정 점검 체계. 본사 담당 현장 의무 목록 점검과 보고 경로. 현장 담당 평가·개선·교육 조치 결과와 확인. 본사 재검토 미흡 사항·개선기한 결과와 이행 증빙</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">본사 관리 조치와 현장 이행 증빙</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">경영책임자등</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">방침·예산·인력</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">법정 점검 체계</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">본사 담당</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">현장 의무 목록</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">점검과 보고 경로</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">현장 담당</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">평가·개선·교육</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">조치 결과와 확인</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">본사 재검토</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">미흡 사항·개선기한</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">결과와 이행 증빙</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">경영책임자의 의무와 현장에서 남기는 개