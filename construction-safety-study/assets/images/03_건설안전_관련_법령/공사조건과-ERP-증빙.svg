<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>8억 원 공사와 80억 원 공사의 검토 경로</title><desc>A동 소규모 보수 예시 8억 원 · 굴착 3 m · 지상높이 8 m 일상 예방과 비용 적용 근거 확인. B동 신축 예시 80억 원 · 굴착 12 m · 지상높이 34 m 계획·대장·선임의 개별 요건 확인. 공통 출발점 현장 결과에서 참여자와 적용 조문 추적 계약·공정·지정·승인 정보를 연결. ERP 증빙 현장 조건 → 업무 일정 → 처리 이력 승인본·접수증·조치 확인 결과</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="387" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">8억 원 공사와 80억 원 공사의 검토 경로</text><rect x="28" y="66" width="464" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">A동 소규모 보수 예시</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">8억 원 · 굴착 3 m · 지상높이 8 m</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">일상 예방과 비용 적용 근거 확인</text><rect x="508" y="66" width="464" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="526" y="96" font-size="21" fill="#0b6b63" font-weight="750">B동 신축 예시</text><text x="526" y="122" font-size="16" fill="#435e70" font-weight="500">80억 원 · 굴착 12 m · 지상높이 34 m</text><text x="526" y="142" font-size="16" fill="#435e70" font-weight="500">계획·대장·선임의 개별 요건 확인</text><rect x="28" y="189" width="464" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="46" y="219" font-size="21" fill="#0b6b63" font-weight="750">공통 출발점</text><text x="46" y="245" font-size="16" fill="#435e70" font-weight="500">현장 결과에서 참여자와 적용 조문 추적</text><text x="46" y="265" font-size="16" fill="#435e70" font-weight="500">계약·공정·지정·승인 정보를 연결</text><rect x="508" y="189" width="464" height="110" rx="11" fill="#edf2f5" stroke="none"/><text x="526" y="219" font-size="21" fill="#0b6b63" font-weight="750">ERP 증빙</text><text x="526" y="245" font-size="16" fill="#435e70" font-weight="500">현장 조건 → 업무 일정 → 처리 이력</text><text x="526" y="265" font-size="16" fill="#435e70" font-weight="500">승인본·접수증·조치 확인 결과</text><rect x="28" y="332" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="360" font-size="17" fill="#435e70" font-weight="650">예시는 알려진 조건으로 비교한다. 다른 장비·구조·계약 요건은 별도 확인</text>
</g></svg>
