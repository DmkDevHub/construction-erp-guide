<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">공사 규모와 작업 조건으로 찾아가는 별표</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">사실 정리</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">공사금액·공종·인원</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">직무·작업 시점</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">시행령</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">선임 대상과 인원</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">별표 2·3·5 등</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">시행규칙</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">교육 시간·내용</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">별표 4·5와 신고 서식</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">현장 증빙</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">선임과 교육·보고 기록</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">변경일·수신 확인</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">하나의 금액 기준을 모