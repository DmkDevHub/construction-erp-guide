<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264" role="img">
<title>세 가지 사전 문서는 목적과 제출 경로가 다르다</title><desc>건설공사 안전관리계획 건설기술 진흥법 제62조 공사 시공·현장 안전관리. 유해위험방지계획서 산업안전보건법 제42조 대상 공사 작업 위험 사전 심사. 안전보건대장 산업안전보건법 제67조 발주·설계·시공의 위험 감소 인계</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="264" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">세 가지 사전 문서는 목적과 제출 경로가 다르다</text><rect x="28" y="66" width="304" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">건설공사 안전관리계획</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">건설기술 진흥법 제62조</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">공사 시공·현장 안전관리</text><rect x="348" y="66" width="304" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="366" y="96" font-size="21" fill="#0b6b63" font-weight="750">유해위험방지계획서</text><text x="366" y="122" font-size="16" fill="#435e70" font-weight="500">산업안전보건법 제42조</text><text x="366" y="142" font-size="16" fill="#435e70" font-weight="500">대상 공사 작업 위험 사전 심사</text><rect x="668" y="66" width="304" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="686" y="96" font-size="21" fill="#0b6b63" font-weight="750">안전보건대장</text><text x="686" y="122" font-size="16" fill="#435e70" font-weight="500">산업안전보건법 제67조</text><text x="686" y="142" font-size="16" fill="#435e70" font-weight="500">발주·설계·시공의 위험 감소 인계</text><rect x="28" y="209" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="237" font-size="17" fill="#435e70" font-weight="650">한 현장에서 복수 요건이 충족될 수 있어 대상과 결과를 문서별로 확인</text>
</g></svg>
