<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>산업안전보건법의 주요 의무 주체</title><desc>사업주 자기 작업의 안전·보건 조치 근로자 참여 평가와 교육. 도급인 관계수급인과 도급 작업 조정 협의·점검과 적용 조치 확인. 관계수급인 소속 근로자 보호 및 평가 작업 범위와 변경 정보 공유. 건설공사발주자 적용 시 단계별 안전보건대장 발주·설계·시공 인계 확인</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="387" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">산업안전보건법의 주요 의무 주체</text><rect x="28" y="66" width="464" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">사업주</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">자기 작업의 안전·보건 조치</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">근로자 참여 평가와 교육</text><rect x="508" y="66" width="464" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="526" y="96" font-size="21" fill="#0b6b63" font-weight="750">도급인</text><text x="526" y="122" font-size="16" fill="#435e70" font-weight="500">관계수급인과 도급 작업 조정</text><text x="526" y="142" font-size="16" fill="#435e70" font-weight="500">협의·점검과 적용 조치 확인</text><rect x="28" y="189" width="464" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="46" y="219" font-size="21" fill="#0b6b63" font-weight="750">관계수급인</text><text x="46" y="245" font-size="16" fill="#435e70" font-weight="500">소속 근로자 보호 및 평가</text><text x="46" y="265" font-size="16" fill="#435e70" font-weight="500">작업 범위와 변경 정보 공유</text><rect x="508" y="189" width="464" height="110" rx="11" fill="#edf2f5" stroke="none"/><text x="526" y="219" font-size="21" fill="#0b6b63" font-weight="750">건설공사발주자</text><text x="526" y="245" font-size="16" fill="#435e70" font-weight="500">적용 시 단계별 안전보건대장</text><text x="526" y="265" font-size="16" fill="#435e70" font-weight="500">발주·설계·시공 인계 확인</text><rect x="28" y="332" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="360" font-size="17" fill="#435e70" font-weight="650">한 공사에 여러 의무 주체가 참여하므로 계약과 현장 사실을 함께 확인</text>
</g></svg>
