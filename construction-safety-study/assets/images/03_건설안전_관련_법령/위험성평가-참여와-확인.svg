<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>위험성평가 결과를 작업과 개선에 연결</title><desc>작업 파악 공정·위치·장비 근로자 의견. 위험성 결정 노출과 피해 고려 감소 대책 정함. 조치·공유 담당과 이행기한 작업자에게 주지. 재확인 조치 효과·남은 위험 조건변경 시 재검토</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">위험성평가 결과를 작업과 개선에 연결</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">작업 파악</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">공정·위치·장비</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">근로자 의견</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">위험성 결정</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">노출과 피해 고려</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">감소 대책 정함</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">조치·공유</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">담당과 이행기한</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">작업자에게 주지</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">재확인</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">조치 효과·남은 위험</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">조건변경 시 재검토</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">기록에서 평가 이력, 근로자 참여, 이행 증빙을 추적</text>
</g></svg>
