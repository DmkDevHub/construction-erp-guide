<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>현장 조건에서 적용 기준까지</title><desc>현장 사실 공사 유형·기간·금액 작업과 도급 관계. 법률 의무의 주체와 목적 위임 근거 확인. 시행령·규칙 대상·절차·서식 별표와 부칙 확인. 고시·현장 적용 세부 기준의 효력 확인 조치와 증빙으로 반영</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="274" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">현장 조건에서 적용 기준까지</text><rect x="28" y="69" width="218" height="130" rx="11" fill="#e6f2ef" stroke="none"/><text x="43" y="103" font-size="22" fill="#0b6b63" font-weight="750">현장 사실</text><text x="43" y="134" font-size="16" fill="#435e70" font-weight="500">공사 유형·기간·금액</text><text x="43" y="158" font-size="16" fill="#435e70" font-weight="500">작업과 도급 관계</text><path d="M 248 137 L 268 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="270" y="69" width="218" height="130" rx="11" fill="#eaf0fa" stroke="none"/><text x="285" y="103" font-size="22" fill="#0b6b63" font-weight="750">법률</text><text x="285" y="134" font-size="16" fill="#435e70" font-weight="500">의무의 주체와 목적</text><text x="285" y="158" font-size="16" fill="#435e70" font-weight="500">위임 근거 확인</text><path d="M 490 137 L 510 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="512" y="69" width="218" height="130" rx="11" fill="#f7eee4" stroke="none"/><text x="527" y="103" font-size="22" fill="#0b6b63" font-weight="750">시행령·규칙</text><text x="527" y="134" font-size="16" fill="#435e70" font-weight="500">대상·절차·서식</text><text x="527" y="158" font-size="16" fill="#435e70" font-weight="500">별표와 부칙 확인</text><path d="M 732 137 L 752 137" stroke="#527585" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="754" y="69" width="218" height="130" rx="11" fill="#edf2f5" stroke="none"/><text x="769" y="103" font-size="22" fill="#0b6b63" font-weight="750">고시·현장 적용</text><text x="769" y="134" font-size="16" fill="#435e70" font-weight="500">세부 기준의 효력 확인</text><text x="769" y="158" font-size="16" fill="#435e70" font-weight="500">조치와 증빙으로 반영</text><rect x="28" y="219" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="247" font-size="17" fill="#435e70" font-weight="650">공식 가이드·법령·회사 기준은 출처와 적용 근거를 각각 표시</text>
</g></svg>
