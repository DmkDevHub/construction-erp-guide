<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img">
<title>같은 개구부에서 다른 결과가 생기면</title><desc>아차사고와 산업재해, 중대재해 및 건설사고 각 판단 경로</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f586a"/></marker><marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#96382d"/></marker><marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086d64"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="960" height="386" rx="18" fill="#fff" stroke="#dbe4e9"/><text x="30" y="42" font-size="27" fill="#152f43" text-anchor="start" font-weight="750">같은 개구부에서 다른 결과가 생기면</text>
<rect x="30" y="72" width="900" height="69" rx="12" fill="#f1f6f8" stroke="none"/><text x="480" y="101" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">공통 상황</text><text x="480" y="126" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">자재 운반 중, 골조층 개구부 주변에서 발을 헛디딤</text><line x1="240" y1="143" x2="240" y2="180" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><line x1="717" y1="143" x2="717" y2="180" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="184" width="420" height="79" rx="12" fill="#e5f2ee" stroke="none"/><text x="240" y="213" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">다치지 않고 멈춤</text><text x="240" y="238" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">아차사고로 공유하고 접근 조건을 개선</text><rect x="500" y="184" width="430" height="79" rx="12" fill="#fbece7" stroke="none"/><text x="715" y="213" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">업무 중 부상 발생</text><text x="715" y="238" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">산업재해 정의와 보고 대상 여부를 확인</text><line x1="717" y1="264" x2="717" y2="294" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="298" width="900" height="57" rx="12" fill="#f1f6f8" stroke="none"/><text x="51" y="322" font-size="18" fill="#152f43" text-anchor="start" font-weight="700">피해 규모와 적용 법령을 각각 확인</text><text x="51" y="345" font-size="16" fill="#3f586a" text-anchor="start" font-weight="500">산업안전보건법상 중대재해  ·  중대재해처벌법상 중대산업재해  ·  건설기술 진흥법상 건설사고</text></g></svg>
