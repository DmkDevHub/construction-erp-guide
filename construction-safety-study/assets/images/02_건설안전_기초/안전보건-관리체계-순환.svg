<svg xmlns="http://www.w3.org/2000/svg" width="960" height="378" viewBox="0 0 960 378" role="img">
<title>개구부 방호의 계획·실행·점검·개선</title><desc>PDCA와 시정 후 확인 및 미완료 분기</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f586a"/></marker><marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#96382d"/></marker><marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086d64"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="960" height="378" rx="18" fill="#fff" stroke="#dbe4e9"/><text x="30" y="42" font-size="27" fill="#152f43" text-anchor="start" font-weight="750">개구부 방호의 계획·실행·점검·개선</text>
<rect x="35" y="79" width="420" height="77" rx="12" fill="#f1f6f8" stroke="none"/><text x="245" y="108" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">계획 · Plan</text><text x="245" y="133" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">개구부 위치와 방호 기준·담당자를 정함</text><line x1="460" y1="117" x2="498" y2="117" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="505" y="79" width="420" height="77" rx="12" fill="#e5f2ee" stroke="none"/><text x="715" y="108" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">실행 · Do</text><text x="715" y="133" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">방호 상태 정비 및 작업조에 변경 공유</text><line x1="713" y1="159" x2="713" y2="192" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="505" y="196" width="420" height="77" rx="12" fill="#e5f2ee" stroke="none"/><text x="715" y="225" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">점검 · Check</text><text x="715" y="250" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">설치·고정 상태와 통제 조건 재확인</text><line x1="500" y1="235" x2="460" y2="235" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="196" width="420" height="77" rx="12" fill="#f1f6f8" stroke="none"/><text x="245" y="225" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">개선 · Act</text><text x="245" y="250" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">원인과 재발 방지책을 다음 계획에 반영</text><line x1="244" y1="193" x2="244" y2="161" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="299" width="890" height="49" rx="12" fill="#fbece7" stroke="none"/><text x="54" y="330" font-size="18" fill="#96382d" text-anchor="start" font-weight="700">점검 미충족  →  접근 통제 유지 · 보완 담당과 기한 지정 · 재확인</text></g></svg>
