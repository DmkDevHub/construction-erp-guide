"/><text x="502" y="313" font-size="16" fill="#96382d" text-anchor="start" font-weight="750">⑦ 소화기 예시</text><text x="34" y="391" font-size="17" fill="#3f586a" text-anchor="start" font-weight="500">망은 보호 대상에 따라 구분합니다. 이 단면은 설치 위치를 설명하는 개념도입니다.</text></g></svg>
