 11" fill="none" stroke="#086d64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M656 215l5 6l12 -14" fill="none" stroke="#086d64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="681" y="220" font-size="14" fill="#086d64" text-anchor="start" font-weight="500">벨트·버클과 지정 연결점 확인</text><path d="M658 232l14 14m0 -14l-14 14" fill="none" stroke="#96382d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="681" y="245" font-size="14" fill="#96382d" text-anchor="start" font-weight="500">버클 미체결·임의 연결점</text><rect x="27" y="279" width="292" height="194" rx="12" fill="#f1f6f8" stroke="none"/><text x="42" y="308" font-size="20" fill="#152f43" text-anchor="start" font-weight="750">보안경</text><g transform="translate(113 309)"><path d="M20 50h84l-10 26H72l-10 -15l-10 15H27zM21 52l-8 -8m90 8l10 -8" fill="none" stroke="#086d64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M42 426l5 6l12 -14" fill="none" stroke="#086d64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="67" y="431" font-size="14" fill="#086d64" text-anchor="start" font-weight="500">측면 틈·손상·시야 확인</text><path d="M44 443l14 14m0 -14l-14 14" fill="none" stroke="#96382d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="67" y="456" font-size="14" fill="#96382d" text-anchor="start" font-weight="500">보호안경을 이마 위에 둠</text><rect x="334" y="279" width="292" height="194" rx="12" fill="#f1f6f8" stroke="none"/><text x="349" y="308" font-size="20" fill="#152f43" text-anchor="start" font-weight="750">방진마스크</text><g transform="translate(420 309)"><path d="M29 50l35 -19l35 19v23L64 93L29 73zM29 54L16 45m83 10l14 -11" fill="none" stroke="#086d64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M349 426l5 6l12 -14" fill="none" stroke="#086d64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="431" font-size="14" fill="#0