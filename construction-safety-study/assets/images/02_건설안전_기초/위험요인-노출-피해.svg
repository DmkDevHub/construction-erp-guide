<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img">
<title>개구부에서 추락으로 이어지는 경로</title><desc>개구부라는 위험요인과 노출 및 피해를 구분하고 통제 위치를 표시</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f586a"/></marker><marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#96382d"/></marker><marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086d64"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="960" height="260" rx="18" fill="#fff" stroke="#dbe4e9"/><text x="30" y="42" font-size="27" fill="#152f43" text-anchor="start" font-weight="750">개구부에서 추락으로 이어지는 경로</text>
<rect x="30" y="77" width="260" height="82" rx="12" fill="#fbece7" stroke="none"/><text x="160" y="106" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">유해·위험요인</text><text x="160" y="131" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">방호가 빠진 바닥 개구부</text><line x1="293" y1="117" x2="345" y2="117" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="77" width="260" height="82" rx="12" fill="#f1f6f8" stroke="none"/><text x="480" y="106" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">노출·사건</text><text x="480" y="131" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">작업자가 접근하여 발을 헛디딤</text><line x1="613" y1="117" x2="665" y2="117" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="77" width="260" height="82" rx="12" fill="#fbece7" stroke="none"/><text x="800" y="106" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">피해</text><text x="800" y="131" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">추락으로 부상할 수 있음</text><rect x="30" y="185" width="900" height="44" rx="12" fill="#e5f2ee" stroke="none"/><text x="50" y="214" font-size="19" fill="#086d64" text-anchor="start" font-weight="700">위험성 판단  ·  접근할 가능성과 추락할 때 피해가 얼마나 클지 함께 살핌</text></g></svg>
