<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img">
<title>공용 진입로에서 생기는 간섭 위험</title><desc>굴착과 골조 작업의 교차 동선 및 시간·동선 분리의 개념도</desc>
