<svg xmlns="http://www.w3.org/2000/svg" width="960" height="373" viewBox="0 0 960 373" role="img">
<title>안전보건 역할과 현장 정보의 이동</title><desc>사업주·안전보건관리책임자·관리감독자와 안전 및 보건관리자의 도움, 작업조 참여</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f586a"/></marker><marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#96382d"/></marker><marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086d64"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="960" height="373" rx="18" fill="#fff" stroke="#dbe4e9"/><text x="30" y="42" font-size="27" fill="#152f43" text-anchor="start" font-weight="750">안전보건 역할과 현장 정보의 이동</text>
<rect x="331" y="65" width="298" height="65" rx="12" fill="#f1f6f8" stroke="none"/><text x="480" y="94" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">사업주·현장 책임 주체</text><text x="480" y="119" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">자원 마련 및 처리 방향 확인</text><line x1="480" y1="132" x2="480" y2="160" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="169" width="270" height="77" rx="12" fill="#f1f6f8" stroke="none"/><text x="163" y="198" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">안전관리자</text><text x="163" y="223" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">안전 기술사항 보좌·지도·조언</text><rect x="345" y="165" width="270" height="77" rx="12" fill="#e5f2ee" stroke="none"/><text x="480" y="194" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">관리감독자</text><text x="480" y="219" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">직접 관여하는 작업과 작업조 관리</text><rect x="662" y="169" width="270" height="77" rx="12" fill="#f1f6f8" stroke="none"/><text x="797" y="198" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">보건관리자</text><text x="797" y="223" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">보건 기술사항 보좌·지도·조언</text><line x1="300" y1="203" x2="340" y2="203" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><line x1="657" y1="203" x2="619" y2="203" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><line x1="514" y1="245" x2="514" y2="276" stroke="#086d64" stroke-width="3" marker-end="url(#tealArrow)"/><line x1="445" y1="275" x2="445" y2="244" stroke="#3f586a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="311" y="279" width="338" height="64" rx="12" fill="#e5f2ee" stroke="none"/><text x="480" y="308" font-size="20" fill="#152f43" text-anchor="middle" font-weight="700">근로자·협력업체 작업조</text><text x="480" y="333" font-size="15" fill="#3f586a" text-anchor="middle" font-weight="500">현장 정보 제보 · 조치·변경 내용 확인</text></g></svg>
