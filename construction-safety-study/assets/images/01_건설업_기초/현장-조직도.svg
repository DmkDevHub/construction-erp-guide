500">계약·변경·기성</text><line x1="590" y1="175" x2="590" y2="204" stroke="#455e71" stroke-width="3"/><rect x="490" y="204" width="200" height="72" rx="12" fill="#e6f3f1" stroke="none"/><text x="590" y="235" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">품질</text><text x="590" y="261" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">시험·검측 자료</text><line x1="810" y1="175" x2="810" y2="204" stroke="#455e71" stroke-width="3"/><rect x="710" y="204" width="200" height="72" rx="12" fill="#e6f3f1" stroke="none"/><text x="810" y="235" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">안전·보건</text><text x="810" y="261" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">예방·점검 지원</text><line x1="150" y1="277" x2="150" y2="307" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="174" y="313" font-size="18" fill="#455e71" text-anchor="start" font-weight="500">협력업체 작업책임자와 일일 작업 위치·일정·변경사항을 공유</text></g></svg>
