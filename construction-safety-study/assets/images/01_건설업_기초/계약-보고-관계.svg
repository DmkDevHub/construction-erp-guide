ke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="870" y="231" font-size="15" fill="#455e71" text-anchor="start" font-weight="500">보고</text><line x1="34" y1="323" x2="84" y2="323" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><text x="98" y="329" font-size="17" fill="#455e71" text-anchor="start" font-weight="500">계약 흐름</text><line x1="255" y1="323" x2="307" y2="323" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="321" y="329" font-size="17" fill="#455e71" text-anchor="start" font-weight="500">작업 정보·변경사항 전달 예시</text></g></svg>
