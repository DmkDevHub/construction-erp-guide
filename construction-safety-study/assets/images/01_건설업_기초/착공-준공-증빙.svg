<svg xmlns="http://www.w3.org/2000/svg" width="960" height="319" viewBox="0 0 960 319" role="img">
<title>착공부터 인수인계까지 남는 문서</title><desc>누가 어느 시점에 어떤 기록을 다음 담당자에게 전달하는지 표시</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#455e71"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif">
<rect x="0" y="0" width="960" height="319" rx="18" fill="#fff" stroke="#dbe5eb"/><text x="30" y="43" font-size="27" fill="#142f43" text-anchor="start" font-weight="750">착공부터 인수인계까지 남는 문서</text>
<rect x="28" y="111" width="205" height="83" rx="12" fill="#e6f3f1" stroke="none"/><text x="130.5" y="142" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">착공 준비</text><text x="130.5" y="168" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">계약·도면·예정공정표</text><text x="130" y="236" font-size="16" fill="#455e71" text-anchor="middle" font-weight="500">발주·공무</text><circle cx="130" cy="90" r="7" fill="#067675"/><line x1="234" y1="150" x2="258" y2="150" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="111" width="205" height="83" rx="12" fill="#f5f8fa" stroke="none"/><text x="362.5" y="142" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">현장 개설</text><text x="362.5" y="168" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">배치·업체·초기 계획</text><text x="362" y="236" font-size="16" fill="#455e71" text-anchor="middle" font-weight="500">현장소장·담당자</text><circle cx="362" cy="90" r="7" fill="#4769a6"/><line x1="466" y1="150" x2="490" y2="150" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><rect x="492" y="111" width="205" height="83" rx="12" fill="#e6f3f1" stroke="none"/><text x="594.5" y="142" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">시공·변경</text><text x="594.5" y="168" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">작업일지·검측·변경이력</text><text x="594" y="236" font-size="16" fill="#455e71" text-anchor="middle" font-weight="500">공사·공무·품질</text><circle cx="594" cy="90" r="7" fill="#067675"/><line x1="698" y1="150" x2="722" y2="150" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><rect x="724" y="111" width="205" height="83" rx="12" fill="#f5f8fa" stroke="none"/><text x="826.5" y="142" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">준공·인계</text><text x="826.5" y="168" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">준공도면·확인·인수 기록</text><text x="826" y="236" font-size="16" fill="#455e71" text-anchor="middle" font-weight="500">시공자·발주 측</text><circle cx="826" cy="90" r="7" fill="#4769a6"/><rect x="28" y="262" width="904" height="34" rx="12" fill="#fff0dc" stroke="none"/><text x="45" y="285" font-size="17" fill="#a45a1b" text-anchor="start" font-weight="500">예시  ·  현장 조건 변경 → 변경안 검토 → 승인된 도면·범위 공유 → 작업 및 검측 기록에 반영</text></g></svg>
