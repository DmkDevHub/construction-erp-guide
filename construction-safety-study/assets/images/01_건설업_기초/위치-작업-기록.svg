<svg xmlns="http://www.w3.org/2000/svg" width="960" height="336" viewBox="0 0 960 336" role="img">
<title>같은 날에도 작업 기록은 구역별로 구분</title><desc>A구역 토공과 B구역 기초 및 ERP 기록의 연결을 나타내는 가상 평면</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#455e71"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif">
<rect x="0" y="0" width="960" height="336" rx="18" fill="#fff" stroke="#dbe5eb"/><text x="30" y="43" font-size="27" fill="#142f43" text-anchor="start" font-weight="750">같은 날에도 작업 기록은 구역별로 구분</text>
<rect x="32" y="73" width="448" height="212" rx="12" fill="#f5f8fa" stroke="#c9d8de"/><rect x="48" y="88" width="189" height="139" rx="12" fill="#e1f3ed" stroke="#067675"/><rect x="259" y="88" width="206" height="139" rx="12" fill="#eaf0fa" stroke="#4769a6"/><text x="64" y="119" font-size="19" fill="#067675" text-anchor="start" font-weight="750">A구역 · 토공</text><text x="275" y="119" font-size="19" fill="#4769a6" text-anchor="start" font-weight="750">B구역 · 기초</text><path d="M76 179h47v17H76zM94 178v-20h26l26 -24l22 29l-14 10" fill="none" stroke="#142f43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M286 154h127v40H286zM306 154v40m23 -40v40m23 -40v40m23 -40v40m23 -40v40m-112 -20h127" fill="none" stroke="#142f43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="221" font-size="16" fill="#142f43" text-anchor="start" font-weight="500">2차 굴착 · 굴착기</text><text x="275" y="221" font-size="16" fill="#142f43" text-anchor="start" font-weight="500">기초 배근 · 철근공</text><text x="54" y="259" font-size="16" fill="#455e71" text-anchor="start" font-weight="500">공용 진입로</text><line x1="164" y1="253" x2="441" y2="253" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><line x1="483" y1="170" x2="511" y2="170" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="83" width="414" height="71" rx="12" fill="#e6f3f1" stroke="none"/><text x="722" y="114" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">작업 기록</text><text x="722" y="140" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">현장 · 구역 · 공종 · 단위작업 · 일자</text><rect x="515" y="178" width="414" height="71" rx="12" fill="#f5f8fa" stroke="none"/><text x="722" y="209" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">증빙</text><text x="722" y="235" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">공정표 · 당일 작업계획 · 점검·사진</text><line x1="722" y1="155" x2="722" y2="176" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="314" font-size="16" fill="#455e71" text-anchor="start" font-weight="500">상대 위치만 나타낸 학습용 평면. 굴착·동선 배치나 작업 기준을 제시하는 도면은 아님</text></g></svg>
