<rect x="32" y="72" width="272" height="74" rx="12" fill="#e6f3f1" stroke="none"/><text x="168" y="103" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">기획</text><text x="168" y="129" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">발주자 · 사업계획</text><rect x="344" y="72" width="272" height="74" rx="12" fill="#e6f3f1" stroke="none"/><text x="480" y="103" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">설계</text><text x="480" y="129" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">설계자 · 도면과 시방서</text><rect x="656" y="72" width="272" height="74" rx="12" fill="#e6f3f1" stroke="none"/><text x="792" y="103" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">발주·계약</text><text x="792" y="129" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">발주자와 시공자 · 계약서</text><rect x="32" y="188" width="272" height="74" rx="12" fill="#edf1fa" stroke="none"/><text x="168" y="219" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">시공</text><text x="168" y="245" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">시공자 · 작업·검측 기록</text><rect x="344" y="188" width="272" height="74" rx="12" fill="#edf1fa" stroke="none"/><text x="480" y="219" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">검사·인수</text><text x="480" y="245" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">발주 측과 시공자 · 준공 자료</text><rect x="656" y="188" width="272" height="74" rx="12" fill="#edf1fa" stroke="none"/><text x="792" y="219" font-size="21" fill="#142f43" text-anchor="middle" font-weight="700">유지관리</text><text x="792" y="245" font-size="15" fill="#455e71" text-anchor="middle" font-weight="500">시설 운영자 · 점검 기록</text><line x1="305" y1="109" x2="339" y2="109" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><line x1="617" y1="109" x2="651" y2="109" stroke="#455e71" stroke-width="3" marker-end="url(#arrow)"/><path d="M 924 108 