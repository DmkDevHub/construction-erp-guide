<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>현장 업무를 찾는 학습용 메뉴 지도</title><desc>업무 준비 회사·현장 · 기준정보 협력업체 · 근로자 · 장비. 현장 활동 위험성평가 · TBM · 허가 점검 · 시정 · 교육 · 보건. 관리와 집계 비용 · 재해 · 의무이행 결재 · 통계 · 증빙. 참여 주체 현장·협력업체에서 기록 본사와 대외 절차에서 확인</desc>
