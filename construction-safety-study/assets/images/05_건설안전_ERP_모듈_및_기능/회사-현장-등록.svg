<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img">
<title>회사와 현장 범위 설정</title><desc>회사 → 현장 가상 시공사 → 별내 생활문화센터. 공사 기간 가상 착공일과 준공 예정일 현장 개설 상태. 작업 구역 A구역 굴착 · B구역 골조 담당 조직 매핑. 역할 범위 현장 공사 담당 · 본사 조회 업무 권한 부여</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="392" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">회사와 현장 범위 설정</text><rect x="28" y="66" width="944" height="260" rx="15" fill="#fff" stroke="#c6d6dc"/><rect x="29" y="67" width="942" height="49" rx="13" fill="#eaf0fa" stroke="none"/><text x="47" y="98" font-size="19" fill="#153449" font-weight="750">학습용 화면 예시</text><text x="770" y="98" font-size="16" fill="#0b6b63" font-weight="700">별내 생활문화센터</text><rect x="42" y="126" width="915" height="37" rx="4" fill="#eef5f4" stroke="none"/><text x="55" y="150" font-size="17" fill="#0b6b63" font-weight="700">회사 → 현장</text><text x="270" y="150" font-size="18" fill="#153449" font-weight="500">가상 시공사 → 별내 생활문화센터</text><rect x="42" y="169" width="915" height="37" rx="4" fill="#f5f8fa" stroke="none"/><text x="55" y="193" font-size="17" fill="#0b6b63" font-weight="700">공사 기간</text><text x="270" y="193" font-size="18" fill="#153449" font-weight="500">가상 착공일과 준공 예정일</text><text x="665" y="193" font-size="15" fill="#435e70" font-weight="500">현장 개설 상태</text><rect x="42" y="212" width="915" height="37" rx="4" fill="#eef5f4" stroke="none"/><text x="55" y="236" font-size="17" fill="#0b6b63" font-weight="700">작업 구역</text><text x="270" y="236" font-size="18" fill="#153449" font-weight="500">A구역 굴착 · B구역 골조</text><text x="665" y="236" font-size="15" fill="#435e70" font-weight="500">담당 조직 매핑</text><rect x="42" y="255" width="915" height="37" rx="4" fill="#f5f8fa" stroke="none"/><text x="55" y="279" font-size="17" fill="#0b6b63" font-weight="700">역할 범위</text><text x="270" y="279" font-size="18" fill="#153449" font-weight="500">현장 공사 담당 · 본사 조회</text><text x="665" y="279" font-size="15" fill="#435e70" font-weight="500">업무 권한 부여</text><rect x="28" y="337" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="365" font-size="17" fill="#435e70" font-weight="650">현장 이관과 종료에는 미해결 건, 운영 기간, 열람 범위를 함께 확인</text>
</g></svg>
