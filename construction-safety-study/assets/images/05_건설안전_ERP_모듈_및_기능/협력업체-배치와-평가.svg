<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img">
<title>협력업체 배치와 평가</title><desc>업체 B사 해당 현장 계약. 배치 범위 A구역 · 토공 11월 04~28일. 작업 담당 업체 작업책임자 B-01 근로자·작업계획 연결. 평가 점검·시정조치 이력 후속 검토 필요</desc>
