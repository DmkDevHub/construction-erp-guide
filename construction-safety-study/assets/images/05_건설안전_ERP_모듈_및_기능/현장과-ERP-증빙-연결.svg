<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img">
<title>하나의 위험요인에서 증빙까지</title><desc>법령 제36조·해당 규칙 적용 근거 확인. 현장 업무 위험평가·조정 작업자와 회의. 절차 대책·점검·시정 실행과 재확인. ERP 기능 해당 메뉴 기록 작업과 상태 연결. 증빙 승인·확인·사진 마감에서 추적</desc>
