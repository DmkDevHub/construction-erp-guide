<title>근로자별 작업 투입과 확인</title><desc>근로자 가상 B-07 소속 B사. 배정 작업 A구역 굴착 보조 11월 작업조. 이수·자격 해당 작업 기준 확인 교육 이력 링크. 투입 상태 검토 완료 작업 변경 시 재확인</desc>
