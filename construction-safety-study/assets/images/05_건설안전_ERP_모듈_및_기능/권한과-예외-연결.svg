<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img">
<title>권한·조건 변경에 따른 연결</title><desc>권한 범위 현장·업체·기간으로 등록·열람 제한 검토·승인은 실제 책임 역할 확인. 변경된 작업 평가 개정 → 전달 → 허가 재검토 이전 승인본과 서로 대조. 재확인 미완료 시정 완료 보고는 등록 재확인 전 미종결로 집계. 기간 마감 미종결은 이월 상태 기록 마감 뒤 정정도 변경 이력 유지</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="387" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">권한·조건 변경에 따른 연결</text><rect x="28" y="66" width="464" height="110" rx="11" fill="#e6f2ef" stroke="none"/><text x="46" y="96" font-size="21" fill="#0b6b63" font-weight="750">권한 범위</text><text x="46" y="122" font-size="16" fill="#435e70" font-weight="500">현장·업체·기간으로 등록·열람 제한</text><text x="46" y="142" font-size="16" fill="#435e70" font-weight="500">검토·승인은 실제 책임 역할 확인</text><rect x="508" y="66" width="464" height="110" rx="11" fill="#eaf0fa" stroke="none"/><text x="526" y="96" font-size="21" fill="#0b6b63" font-weight="750">변경된 작업</text><text x="526" y="122" font-size="16" fill="#435e70" font-weight="500">평가 개정 → 전달 → 허가 재검토</text><text x="526" y="142" font-size="16" fill="#435e70" font-weight="500">이전 승인본과 서로 대조</text><rect x="28" y="189" width="464" height="110" rx="11" fill="#f7eee4" stroke="none"/><text x="46" y="219" font-size="21" fill="#0b6b63" font-weight="750">재확인 미완료</text><text x="46" y="245" font-size="16" fill="#435e70" font-weight="500">시정 완료 보고는 등록</text><text x="46" y="265" font-size="16" fill="#435e70" font-weight="500">재확인 전 미종결로 집계</text><rect x="508" y="189" width="464" height="110" rx="11" fill="#edf2f5" stroke="none"/><text x="526" y="219" font-size="21" fill="#0b6b63" font-weight="750">기간 마감</text><text x="526" y="245" font-size="16" fill="#435e70" font-weight="500">미종결은 이월 상태 기록</text><text x="526" y="265" font-size="16" fill="#435e70" font-weight="500">마감 뒤 정정도 변경 이력 유지</text><rect x="28" y="332" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="360" font-size="17" fill="#435e70" font-weight="650">권한·법정 제출·현장 작업 가능 상태는 각각 의미가 다르다</text>
</g></svg>
