<title>재해·아차사고 상세와 후속 과제</title><desc>사건 NM-A-002 · 아차사고 피해 없음. 보고 검토 확인된 사실과 적용 근거 법정 보고 별도 확인. 원인·대책 반입 시간 변경 미전달 교차로 통제 개선. 재발방지 RA-A-014와 변경 교육 연결 후속 확인 기한</desc>
