<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img">
<title>중대재해 예방 의무이행 현황</title><desc>의무 관계 법령 이행 점검 하반기. 현장 별내 생활문화센터 현장 대응 자료 제출. 미흡 설비 보완 후 확인 증빙 누락 후속 기한 지정. 보완 확인 담당 조치와 본사 재확인 근거 번호 연결</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="392" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">중대재해 예방 의무이행 현황</text><rect x="28" y="66" width="944" height="260" rx="15" fill="#fff" stroke="#c6d6dc"/><rect x="29" y="67" width="942" height="49" rx="13" fill="#eaf0fa" stroke="none"/><text x="47" y="98" font-size="19" fill="#153449" font-weight="750">학습용 화면 예시</text><text x="770" y="98" font-size="16" fill="#0b6b63" font-weight="700">별내 생활문화센터</text><rect x="42" y="126" width="915" height="37" rx="4" fill="#eef5f4" stroke="none"/><text x="55" y="150" font-size="17" fill="#0b6b63" font-weight="700">의무</text><text x="270" y="150" font-size="18" fill="#153449" font-weight="500">관계 법령 이행 점검</text><text x="665" y="150" font-size="15" fill="#435e70" font-weight="500">하반기</text><rect x="42" y="169" width="915" height="37" rx="4" fill="#f5f8fa" stroke="none"/><text x="55" y="193" font-size="17" fill="#0b6b63" font-weight="700">현장</text><text x="270" y="193" font-size="18" fill="#153449" font-weight="500">별내 생활문화센터</text><text x="665" y="193" font-size="15" fill="#435e70" font-weight="500">현장 대응 자료 제출</text><rect x="42" y="212" width="915" height="37" rx="4" fill="#eef5f4" stroke="none"/><text x="55" y="236" font-size="17" fill="#0b6b63" font-weight="700">미흡</text><text x="270" y="236" font-size="18" fill="#153449" font-weight="500">설비 보완 후 확인 증빙 누락</text><text x="665" y="236" font-size="15" fill="#435e70" font-weight="500">후속 기한 지정</text><rect x="42" y="255" width="915" height="37" rx="4" fill="#f5f8fa" stroke="none"/><text x="55" y="279" font-size="17" fill="#0b6b63" font-weight="700">보완 확인</text><text x="270" y="279" font-size="18" fill="#153449" font-weight="500">담당 조치와 본사 재확인</text><text x="665" y="279" font-size="15" fill="#435e70" font-weight="500">근거 번호 연결</text><rect x="28" y="337" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="365" font-size="17" fill="#435e70" font-weight="650">본사 관리 조치와 각 현장의 구체적인 실행 증빙을 연결</text>
</g></svg>
