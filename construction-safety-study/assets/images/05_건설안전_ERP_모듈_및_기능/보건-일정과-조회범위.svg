<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img">
<title>보건 기록의 항목과 열람 범위</title><desc>노출 작업 B구역 콘크리트 절단 분진·소음. 측정 일정 업무 적용 여부 확인 보건 담당. 일반 조회 집진 및 통제 조치 상태 개인 건강정보 숨김. 제한 조회 개인 결과와 사후관리 해당 권한만</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527585"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="1000" height="392" rx="17" fill="#fff" stroke="#dce6e9"/><text x="28" y="42" font-size="28" fill="#153449" font-weight="750">보건 기록의 항목과 열람 범위</text><rect x="28" y="66" width="944" height="260" rx="15" fill="#fff" stroke="#c6d6dc"/><rect x="29" y="67" width="942" height="49" rx="13" fill="#eaf0fa" stroke="none"/><text x="47" y="98" font-size="19" fill="#153449" font-weight="750">학습용 화면 예시</text><text x="770" y="98" font-size="16" fill="#0b6b63" font-weight="700">별내 생활문화센터</text><rect x="42" y="126" width="915" height="37" rx="4" fill="#eef5f4" stroke="none"/><text x="55" y="150" font-size="17" fill="#0b6b63" font-weight="700">노출 작업</text><text x="270" y="150" font-size="18" fill="#153449" font-weight="500">B구역 콘크리트 절단</text><text x="665" y="150" font-size="15" fill="#435e70" font-weight="500">분진·소음</text><rect x="42" y="169" width="915" height="37" rx="4" fill="#f5f8fa" stroke="none"/><text x="55" y="193" font-size="17" fill="#0b6b63" font-weight="700">측정 일정</text><text x="270" y="193" font-size="18" fill="#153449" font-weight="500">업무 적용 여부 확인</text><text x="665" y="193" font-size="15" fill="#435e70" font-weight="500">보건 담당</text><rect x="42" y="212" width="915" height="37" rx="4" fill="#eef5f4" stroke="none"/><text x="55" y="236" font-size="17" fill="#0b6b63" font-weight="700">일반 조회</text><text x="270" y="236" font-size="18" fill="#153449" font-weight="500">집진 및 통제 조치 상태</text><text x="665" y="236" font-size="15" fill="#435e70" font-weight="500">개인 건강정보 숨김</text><rect x="42" y="255" width="915" height="37" rx="4" fill="#f5f8fa" stroke="none"/><text x="55" y="279" font-size="17" fill="#0b6b63" font-weight="700">제한 조회</text><text x="270" y="279" font-size="18" fill="#153449" font-weight="500">개인 결과와 사후관리</text><text x="665" y="279" font-size="15" fill="#435e70" font-weight="500">해당 권한만</text><rect x="28" y="337" width="944" height="39" rx="7" fill="#e6f2ef" stroke="none"/><text x="47" y="365" font-size="17" fill="#435e70" font-weight="650">필요한 근거와 열람 역할을 구분하고 민감정보는 업무 목적대로 관리</text>
</g></svg>
