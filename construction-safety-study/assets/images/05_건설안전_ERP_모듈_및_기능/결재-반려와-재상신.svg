<text x="45" y="106">작성·상신</text><text x="290" y="106">검토</text><text x="535" y="106">승인</text><text x="780" y="106">해당 대외 절차</text>
<text x="290" y="231" fill="#96382d">반려</text>
</g>
<g font-size="16" fill="#435e70">
